[project]
name = "llm-security-scanner"
version = "0.1.0"
description = "CLI security scanner for LLM-powered API endpoints mapped to OWASP Top 10 for LLM Applications"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "rich>=13.7.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
scanner = "scanner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["scanner"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
